# For documentation on how to configure this file,
# see https://diesel.rs/guides/configuring-diesel-cli

# Keep the checked-in schema in sync with the database. In CI/production,
# run migrations with `--locked-schema` (see `make db-migrate-prod`) so a
# stale src/db/schema.rs fails the deploy instead of being silently rewritten.
[print_schema]
file = "src/db/schema.rs"
generate_missing_sql_type_definitions = false
custom_type_derives = ["diesel::query_builder::QueryId", "Clone"]

[migrations_directory]
dir = "migrations"